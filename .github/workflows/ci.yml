name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

jobs:
    coverage:
        name: "Coverage"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v7

            - name: "Set up pixi"
              uses: prefix-dev/setup-pixi@v0
              with:
                  environments: py312

            - name: "Check code coverage"
              run: pixi run -e py312 coverage

            - name: "Coveralls"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pixi run -e py312 coveralls --service=github --rcfile=pyproject.toml

    lint:
        name: "Code style"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v7

            - name: "Set up pixi"
              uses: prefix-dev/setup-pixi@v0
              with:
                  environments: default

            - name: "Check code style"
              run: pixi run lint

    test:
        name: "Test ${{ matrix.os }} with ${{ matrix.python-version }}"
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                python-version: ["py311", "py312", "py313", "py314", "py315"]

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v7

            - name: "Set up pixi"
              uses: prefix-dev/setup-pixi@v0
              with:
                  environments: ${{ matrix.python-version }}

            - name: "Run unit tests"
              run: pixi run -e ${{ matrix.python-version }} tests

    uv:
        name: "Test ${{ matrix.os }} without cdd"
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]

        env:
            MPLBACKEND: Agg

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v7

            - name: "Set up uv"
              uses: astral-sh/setup-uv@v7

            - name: "Run unit tests"
              run: uv run --locked python -m unittest discover

            - name: "Run examples that don't require cdd"
              run: |
                  uv run --locked examples/polygon_chebyshev_center.py
                  uv run --locked examples/polytope_projection.py

    ci_success:
        name: "CI success"
        runs-on: ubuntu-latest
        needs: [coverage, lint, test, uv]
        steps:
            - run: echo "CI workflow completed successfully"
