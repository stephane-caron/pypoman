[workspace]
name = "pypoman"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
pip = "*"
# Toolchain to build the PyPI packages that ship no wheels (pycddlib, pyclipper)
# from source.
c-compiler = "*"
cxx-compiler = "*"
cython = "*"
# cddlib and gmp are build dependencies for pycddlib, which is installed from
# PyPI (conda-forge only ships pycddlib 1.x).
cddlib = "*"
gmp = "*"
# cvxopt from conda-forge ships prebuilt for all supported Pythons and links
# GLPK, the LP solver used by pypoman when available.
cvxopt = "*"

[pypi-dependencies]
pypoman = { path = ".", editable = true }

# Unit tests and coverage. The optional extras (pyclipper, qpsolvers) are pulled
# in so that the whole test suite runs, matching the `all` extra of the package.
[feature.test.dependencies]
coverage = ">=5.5"
coveralls = ">=3.3.1"

[feature.test.pypi-dependencies]
pyclipper = ">=1.3.0"
qpsolvers = ">=3.3.1"

[feature.test.tasks]
tests = "python -m unittest discover"
coverage = "coverage erase && coverage run -m unittest discover && coverage report --rcfile=pyproject.toml"

# Code style. pytype only supports up to Python 3.12, so the lint environment is
# pinned to that version (see the `[environments]` table below).
[feature.lint.dependencies]
mypy = ">=0.812"
pylint = ">=2.8.2"
ruff = ">=0.5.4"

[feature.lint.pypi-dependencies]
pytype = ">=2023.5.24"

[feature.lint.tasks]
ruff-check = "ruff check pypoman"
ruff-format = "ruff format --check --diff pypoman"
mypy = "mypy pypoman"
pylint = "pylint pypoman --exit-zero"
pytype = "pytype pypoman"
lint = { depends-on = ["ruff-check", "ruff-format", "mypy", "pylint", "pytype"] }

# One feature per supported Python version, combined into test environments in
# the `[environments]` table.
[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"

[environments]
# `pixi run tests` / `pixi run lint` use this environment.
default = { features = ["py312", "test", "lint"] }
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
py315 = ["py315", "test"]
