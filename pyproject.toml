[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pypoman"
readme = "README.md"
authors = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
maintainers = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
dynamic = ['version', 'description']
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "cvxopt >=1.2.6",
    "matplotlib >=3.3.4",
    "numpy >=1.15.4",
    "scipy >=1.7.0",
]
keywords = ["convex, polyhedron, polyhedra, polytope, projection, duality"]

[project.optional-dependencies]
all = [
    "pycddlib >=3.0.0",
    "pyclipper >=1.3.0",
    "qpsolvers >=3.3.1",
]
cdd = [
    "pycddlib >=3.0.0",
]

[project.urls]
Homepage = "https://github.com/stephane-caron/pypoman"
Documentation = "https://stephane-caron.github.io/pypoman/"
Source = "https://github.com/stephane-caron/pypoman"
Tracker = "https://github.com/stephane-caron/pypoman/issues"
Changelog = "https://github.com/stephane-caron/pypoman/blob/main/CHANGELOG.md"

[tool.coverage]
report.include = ["pypoman/*"]

[tool.flit.sdist]
exclude = [
    ".git*",
    "CONTRIBUTING.md",
    "doc/",
    "examples/",
    "pixi.lock",
    "tests/",
    "uv.lock",
]

[tool.mypy]
disable_error_code = ["attr-defined", "name-defined"]
ignore_missing_imports = true
warn_no_return = true

# Pixi reads the Python version from `requires-python` above, and turns each
# entry of `[project.optional-dependencies]` into a feature (e.g. `all`).
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
pip = "*"
# Toolchain to build the PyPI packages that ship no wheels (pycddlib, pyclipper)
# from source.
c-compiler = "*"
cxx-compiler = "*"
cython = "*"
# cddlib and gmp are build dependencies for pycddlib, which is installed from
# PyPI (conda-forge only ships pycddlib 1.x).
cddlib = "*"
gmp = "*"
# cvxopt from conda-forge ships prebuilt for all supported Pythons and links
# GLPK, the LP solver used by pypoman when available.
cvxopt = "*"

[tool.pixi.pypi-dependencies]
pypoman = { path = ".", editable = true }

# Unit tests and coverage. Test environments also include the `all` feature so
# that the optional extras (pyclipper, qpsolvers) are covered by the test suite.
[tool.pixi.feature.test.dependencies]
coverage = ">=5.5"
coveralls = ">=3.3.1"

[tool.pixi.feature.test.tasks]
tests = "python -m unittest discover"
coverage = "coverage erase && coverage run -m unittest discover && coverage report --rcfile=pyproject.toml"

# Code style. pytype only supports up to Python 3.12, so the lint environment is
# pinned to that version (see the `[tool.pixi.environments]` table below).
[tool.pixi.feature.lint.dependencies]
mypy = ">=0.812"
pylint = ">=2.8.2"
ruff = ">=0.5.4"

[tool.pixi.feature.lint.pypi-dependencies]
pytype = ">=2023.5.24"

[tool.pixi.feature.lint.tasks]
ruff-check = "ruff check pypoman"
ruff-format = "ruff format --check --diff pypoman"
mypy = "mypy pypoman"
pylint = "pylint pypoman --exit-zero"
pytype = "pytype pypoman"
lint = { depends-on = ["ruff-check", "ruff-format", "mypy", "pylint", "pytype"] }

# One feature per supported Python version, combined into test environments in
# the `[tool.pixi.environments]` table.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py315.dependencies]
python = "3.15.*"

[tool.pixi.environments]
# `pixi run tests` / `pixi run lint` use this environment.
default = { features = ["py312", "test", "all", "lint"] }
py311 = ["py311", "test", "all"]
py312 = ["py312", "test", "all"]
py313 = ["py313", "test", "all"]
py314 = ["py314", "test", "all"]
py315 = ["py315", "test", "all"]

[tool.pylint.messages_control]
# C0103: Argument name doesn't conform to snake_case naming style
# (pypoman uses uppercase for matrices)
disable = ["C0103", "import-error"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I001",
    # pydocstyle
    "D"
]
ignore = [
    "D401",  # good for methods but not for class docstrings
    "D405",  # British-style section names are also "proper"!
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
