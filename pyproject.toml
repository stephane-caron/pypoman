[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pypoman"
readme = "README.md"
authors = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
maintainers = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
dynamic = ['version', 'description']
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "cvxopt >=1.2.6",
    "matplotlib >=3.3.4",
    "numpy >=1.15.4",
    "pycddlib >=3.0.0",
    "scipy >=1.7.0",
]
keywords = ["convex, polyhedron, polyhedra, polytope, projection, duality"]

[project.optional-dependencies]
all = [
    "pyclipper >=1.3.0",
    "qpsolvers >=3.3.1",
]

[project.urls]
Homepage = "https://github.com/stephane-caron/pypoman"
Documentation = "https://stephane-caron.github.io/pypoman/"
Source = "https://github.com/stephane-caron/pypoman"
Tracker = "https://github.com/stephane-caron/pypoman/issues"
Changelog = "https://github.com/stephane-caron/pypoman/blob/main/CHANGELOG.md"

[tool.coverage]
report.include = ["pypoman/*"]

[tool.mypy]
disable_error_code = ["attr-defined", "name-defined"]
ignore_missing_imports = true
warn_no_return = true

[tool.pylint.messages_control]
# C0103: Argument name doesn't conform to snake_case naming style
# (pypoman uses uppercase for matrices)
disable = ["C0103", "import-error"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I001",
    # pydocstyle
    "D"
]
ignore = [
    "D401",  # good for methods but not for class docstrings
    "D405",  # British-style section names are also "proper"!
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
